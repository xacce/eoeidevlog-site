<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Девлог — интерактивные примеры</title>
<style>
  :root {
    --bg: #111318;
    --panel: #181b21;
    --line: #2a2f3a;
    --text: #dde2ea;
    --dim: #8b94a3;
    --accent: #7aa2f7;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  body {
    margin: 0;
    padding: 48px 20px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 var(--sans);
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.lead { color: var(--dim); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin-bottom: 12px; }
  a.card {
    display: block;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
  }
  a.card:hover { border-color: var(--accent); }
  a.card .num { color: var(--dim); font-size: 13px; }
  a.card .name { display: block; margin-top: 4px; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Интерактивные примеры к девлогу</h1>
  <p class="lead">Выпуск 00.</p>
  <ul>
    <li>
      <a class="card" href="demo/01-seed-loot.html">
        <span class="num">01</span>
        <span class="name">Сто предметов из одного числа</span>
      </a>
    </li>
    <li>
      <a class="card" href="demo/02-noise-vs-random.html">
        <span class="num">02</span>
        <span class="name">Шум — это рандом, брошенный реже</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
