<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лут из одного числа</title>
<style>
  :root {
    --bg: #111318;
    --panel: #181b21;
    --panel-2: #1d212a;
    --line: #2a2f3a;
    --text: #dde2ea;
    --dim: #8b94a3;
    --dim-2: #6d7684;
    --accent: #7aa2f7;
    --blood: #b03434;
    --ghost: #9fdbe8;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .r0 { --rc: #8b94a3; }
  .r1 { --rc: #6fae7a; }
  .r2 { --rc: #5aa9d6; }
  .r3 { --rc: #a98ad6; }
  .r4 { --rc: #d8a35c; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  .demo {
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem 1rem 2.5rem;
    overflow-wrap: break-word;
  }

  h1 {
    font-size: 1.35rem;
    line-height: 1.3;
    margin: 0 0 0.6rem;
    font-weight: 600;
  }

  p { margin: 0 0 0.8rem; }
  p.lead { color: var(--dim); }

  .block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.9rem;
    margin-top: 1.1rem;
  }

  .hidden { display: none !important; }

  /* ——— сцена ——— */

  .stage {
    margin-top: 1.1rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #12151c;
    overflow: hidden;
  }

  .stage svg { display: block; width: 100%; height: auto; max-width: 100%; }

  #bossDead, #ghost, #drop1, #drop2 { display: none; }
  .killed #bossAlive { display: none; }
  .killed #bossDead { display: block; }
  .killed #ghost { display: block; animation: rise 0.9s ease-out; }
  .hasSword1 #drop1 { display: block; }
  .hasSword2 #drop2 { display: block; }
  .hasSword1 #drop1 .sw, .hasSword2 #drop2 .sw { animation: plop 0.5s ease-out; }

  #ghostBody { animation: floaty 2.6s ease-in-out infinite; }
  .flinch #ghostBody { animation: flinch 0.6s ease-out, floaty 2.6s 0.6s ease-in-out infinite; }

  #heroArm { transition: transform 0.4s ease-out; transform-origin: 128px 128px; }
  .raised #heroArm { transform: rotate(-95deg); }

  @keyframes rise {
    from { transform: translateY(46px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes flinch {
    0% { transform: translateY(0) rotate(0); }
    30% { transform: translateY(4px) rotate(7deg); }
    60% { transform: translateY(-2px) rotate(-5deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  @keyframes plop {
    0% { transform: translateY(-30px); opacity: 0; }
    70% { transform: translateY(4px); opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .p { opacity: 0; }
  .go .p { animation: fly 0.75s ease-out forwards; }
  @keyframes fly {
    0% { transform: translate(0, 0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
  }

  /* ——— цепочка чисел ——— */

  .chainwrap { margin-top: 1.1rem; }

  .chain {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.25rem 0.35rem;
    font-family: var(--mono);
  }

  .tok {
    padding: 0.15rem 0.45rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--accent);
    font-size: 0.95rem;
    overflow-wrap: anywhere;
  }

  .tok.seed { color: var(--text); }
  .tok.fresh { animation: catch 0.9s ease-out; }

  @keyframes catch {
    0% { background: #35507d; color: #eaf1ff; }
    100% { background: var(--bg); color: var(--accent); }
  }

  .fn { flex: none; width: 2rem; height: 1rem; color: var(--dim); }
  .fn.fresh { animation: wiggle 0.8s ease-out; }
  @keyframes wiggle {
    0% { transform: rotate(0); color: #eaf1ff; }
    30% { transform: rotate(10deg); }
    60% { transform: rotate(-8deg); }
    100% { transform: rotate(0); }
  }

  .spinnote {
    margin-top: 0.45rem;
    font-size: 0.82rem;
    color: var(--dim);
    min-height: 1.2em;
  }

  /* полоса отсеков: куда попало число */

  .lane { position: relative; margin-top: 0.7rem; }

  .cells {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }

  .cells .c {
    padding: 4px 1px;
    text-align: center;
    font-size: clamp(7px, 1.6vw, 10px);
    line-height: 1.2;
    color: var(--dim);
    background: #191d25;
    border-left: 1px solid var(--line);
    overflow-wrap: anywhere;
  }

  .cells .c:first-child { border-left: none; }
  .cells .c.lit { background: #23324d; color: #dbe6fb; }
  .cells .c.peek { animation: peek 1.2s ease-out; }
  @keyframes peek {
    0% { background: #4d2323; color: #fbdbdb; }
    100% { background: #191d25; color: var(--dim); }
  }

  .mk {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 2px;
    margin-left: -1px;
    background: var(--accent);
    border-radius: 1px;
  }

  .under {
    display: flex;
    justify-content: space-between;
    margin-top: 0.2rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--dim-2);
  }

  /* ——— карточки лута ——— */

  .cards { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.1rem; }

  .card {
    flex: 1 1 240px;
    min-width: 0;
    border: 1px solid var(--line);
    border-left: 3px solid var(--rc, var(--line));
    border-radius: 6px;
    background: var(--panel-2);
    padding: 0.7rem 0.8rem;
    animation: plopcard 0.45s ease-out;
  }

  @keyframes plopcard {
    from { transform: translateY(10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .cname {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--rc, var(--text));
    margin-bottom: 0.15rem;
    overflow-wrap: break-word;
  }

  .crar { font-size: 0.78rem; color: var(--dim); margin-bottom: 0.5rem; }

  .rows {
    display: grid;
    grid-template-columns: minmax(0, auto) minmax(0, 1fr);
    gap: 0.15rem 0.7rem;
    font-size: 0.87rem;
  }

  .rows dt { color: var(--dim); }
  .rows dd {
    margin: 0;
    font-family: var(--mono);
    text-align: right;
    overflow-wrap: anywhere;
  }

  .rows dd.reveal { animation: catch 0.9s ease-out; border-radius: 4px; }

  .seedline {
    margin-top: 0.55rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--line);
    font-size: 0.8rem;
    color: var(--dim);
  }

  .seedline b {
    font-family: var(--mono);
    color: var(--text);
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  .match {
    margin-top: 0.7rem;
    padding: 0.5rem 0.6rem;
    border-left: 2px solid #6fae7a;
    font-size: 0.85rem;
    color: #b6d6bc;
  }

  /* ——— диалог ——— */

  .dlg {
    margin-top: 1.1rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    padding: 0.8rem 0.9rem;
    min-height: 8.2em;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    cursor: pointer;
    user-select: none;
  }

  .who {
    align-self: flex-start;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--line);
  }

  .who.hero { color: #a9c4fb; border-color: #35507d; background: #1b2537; }
  .who.ghost { color: #aee7f2; border-color: #2f5c66; background: #16272c; }
  .who.note { visibility: hidden; }

  .say { font-size: 0.98rem; min-height: 2.9em; }
  .say.note { color: var(--dim); font-style: italic; }

  .btns { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: auto; }

  button {
    flex: 1 1 auto;
    min-width: 0;
    padding: 0.5rem 0.8rem;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.9rem;
    cursor: pointer;
  }

  button:hover { border-color: var(--accent); }
  button:active { background: #232833; }

  button.next { color: var(--dim); }
  button.kill {
    background: #45201f;
    border-color: #7d3532;
    color: #f2c6c2;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  button.kill:hover { border-color: #b05450; }

  @media (max-width: 380px) {
    .demo { padding: 1.1rem 0.7rem 2rem; }
    .say { font-size: 0.93rem; }
  }
</style>
</head>
<body>

<script>
// ===== CORE START =====
// Одна и та же крутка для всего: из числа делается следующее число от 0 до 9999.
// Никакого случайного — только перемешивание разрядов.
function spin(x) {
  var h = (x ^ 2747636419) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 2654435769) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 2654435769) >>> 0;
  h = (h ^ (h >>> 16)) >>> 0;
  return h % 10000;
}

// Цепочка: каждое следующее число выкручено из предыдущего.
function chain(seed, k) {
  var out = [], x = seed >>> 0;
  for (var i = 0; i < k; i++) { x = spin(x); out.push(x); }
  return out;
}

var SEED = 234236291;

var TYPES = ['лом', 'меч', 'щит', 'серп', 'лук', 'цеп', 'кол', 'коса', 'багор', 'топор'];
var PREFIXES = ['ржавый', 'кривой', 'тупой', 'гнутый', 'унылый', 'поганый', 'дырявый', 'косой', 'трухлявый', 'обшарпанный'];
var RARITIES = ['обычный', 'необычный', 'редкий', 'эпический', 'легендарный'];

// Полоса 0..9999 нарезана на десять отсеков по тысяче — какой отсек, такой тип.
function bucket(n) { return Math.floor(n / 1000); }

function rarityOf(n) {
  if (n < 6000) return 0;
  if (n < 8500) return 1;
  if (n < 9600) return 2;
  if (n < 9900) return 3;
  return 4;
}

// Число, делённое на тысячу, — и есть значение свойства. Без вранья и без округлений.
function fmt(n) { return (n / 1000).toFixed(3); }

// Весь предмет — из шести оборотов одного числа.
function makeItem(seed) {
  var c = chain(seed, 6);
  return {
    numbers: c,
    type: bucket(c[0]),
    damage: fmt(c[1]),
    speed: fmt(c[2]),
    prefix: bucket(c[3]),
    weight: fmt(c[4]),
    rarity: rarityOf(c[5])
  };
}
// ===== CORE END =====

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');
  var chainBlock = $('chainBlock');
  var chainEl = $('chain');
  var spinNote = $('spinNote');
  var laneWrap = $('laneWrap');
  var laneCells = $('laneCells');
  var laneMark = $('laneMark');
  var cardsEl = $('cards');
  var matchEl = $('matchLine');
  var dlgEl = $('dlg');
  var whoEl = $('who');
  var sayEl = $('say');
  var btnsEl = $('btns');

  var IT = makeItem(SEED);
  var C = IT.numbers;
  var MISS = 2000 - C[0]; // сколько не добрал до отсека щита
  var PREF = PREFIXES[IT.prefix];
  var NAME = PREF.charAt(0).toUpperCase() + PREF.slice(1) + ' ' + TYPES[IT.type];

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;';
    });
  }

  // закорючка-функция между числами: та самая, которую игрок не понял
  var SQ = '<svg class="fn" viewBox="0 0 34 16" aria-hidden="true">' +
    '<path d="M2 8 C 5 1, 9 15, 13 8 S 19 1, 22 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>' +
    '<path d="M24 8 L30 8 M30 8 L27 5.4 M30 8 L27 10.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>' +
    '</svg>';

  // ——— состояние ———

  var st;
  function freshState() {
    return {
      i: 0,
      lock: false,
      shown: 0,       // сколько чисел цепочки видно (0 = только сид ещё не показан)
      seedShown: false,
      dangling: false, // закорючка показана, но результата ещё нет
      spins: 0,
      revealed: {},
      card2: false
    };
  }

  // ——— цепочка ———

  function renderChain(freshIdx, freshFn) {
    var html = '';
    if (st.seedShown) html += '<span class="tok seed">' + SEED + '</span>';
    for (var k = 0; k < st.shown; k++) {
      html += SQ + '<span class="tok' + (k === freshIdx ? ' fresh' : '') + '">' + C[k] + '</span>';
    }
    if (st.dangling) html += SQ;
    chainEl.innerHTML = html;
    if (freshFn || st.dangling) {
      var fns = chainEl.querySelectorAll('.fn');
      if (fns.length) fns[fns.length - 1].classList.add('fresh');
    }
  }

  function showLane() {
    var html = '';
    for (var i = 0; i < TYPES.length; i++) {
      html += '<span class="c' + (i === IT.type ? ' lit' : '') + '" data-b="' + i + '">' + TYPES[i] + '</span>';
    }
    laneCells.innerHTML = html;
    laneMark.style.left = (C[0] / 10000 * 100).toFixed(2) + '%';
    laneWrap.classList.remove('hidden');
  }

  function peekShield() {
    var c = laneCells.querySelector('[data-b="2"]');
    if (c) { c.classList.remove('peek'); void c.offsetWidth; c.classList.add('peek'); }
  }

  // ——— карточки ———

  function q(v, key) { return st.revealed[key] ? v : '???'; }

  function cardHtml(idx, fresh) {
    var known = st.revealed.name;
    return '<div class="card' + (known ? ' r' + IT.rarity : '') + '">' +
      '<div class="cname">' + (known ? esc(NAME) : '??? меч') + '</div>' +
      '<div class="crar">' + q(RARITIES[IT.rarity], 'rar') + ' · добыча №' + idx + '</div>' +
      '<dl class="rows">' +
        '<dt>урон</dt><dd' + (fresh === 'dmg' ? ' class="reveal"' : '') + '>' + q(IT.damage, 'dmg') + '</dd>' +
        '<dt>скорость</dt><dd' + (fresh === 'spd' ? ' class="reveal"' : '') + '>' + q(IT.speed, 'spd') + '</dd>' +
        '<dt>вес</dt><dd' + (fresh === 'wt' ? ' class="reveal"' : '') + '>' + q(IT.weight + ' кг', 'wt') + '</dd>' +
      '</dl>' +
      '<div class="seedline">выведен из числа <b>' + SEED + '</b></div>' +
    '</div>';
  }

  function renderCards(fresh) {
    var html = cardHtml(1, fresh);
    if (st.card2) html += cardHtml(2, null);
    cardsEl.innerHTML = html;
    cardsEl.classList.remove('hidden');
  }

  function reveal(key, fresh) {
    st.revealed[key] = true;
    renderCards(fresh);
  }

  // ——— сцена ———

  function killAnim() {
    stage.classList.add('killed');
    var b = $('burst');
    b.classList.remove('go'); void b.getBoundingClientRect(); b.classList.add('go');
  }

  function rekillAnim() {
    stage.classList.add('flinch');
    var b = $('gburst');
    b.classList.remove('go'); void b.getBoundingClientRect(); b.classList.add('go');
    setTimeout(function () { stage.classList.remove('flinch'); }, 700);
  }

  // ——— сценарий ———
  // w: кто говорит (p — игрок, g — дух, n — ремарка); fx — что происходит на экране.

  var L = [
    { w: 'n', t: 'Босс почти готов.', btn: 'kill' },
    { w: 'g', t: 'Вот твой лут. ' + SEED + '.', fx: function () {
        st.seedShown = true; chainBlock.classList.remove('hidden'); renderChain(-1, false);
      } },
    { w: 'p', t: 'Че???' },
    { w: 'g', t: 'Ну лут. Выведи из него, что там в нём.' },
    { w: 'p', t: 'Дай мне мой лут, или я найду способ тебя ещё раз прикончить.' },
    { w: 'g', t: 'Ладно, вот функция, как вывести лут из этого числа.', fx: function () {
        st.dangling = true; renderChain(-1, true);
      } },
    { w: 'p', t: 'ЧЕГО БЛЯТЬ?' },
    { w: 'g', t: 'Ладно, давай сделаем вид, что ты понимаешь эту часть.' },
    { w: 'p', t: 'Я тебя серьёзно ещё раз убью сейчас.' },
    { w: 'g', t: 'Ох. Ну вот я дал тебе число, дал функцию. Применяешь функцию к числу — получаешь другое число.' },
    { w: 'p', t: 'Какие блять числа, где мой меч, или щит, или что ты там в своей жопе прятал?' },
    { w: 'g', t: 'Ну смотри. Функция эта одно число превращает в другое.' },
    { w: 'p', t: 'Я смотрю, тебе не терпится снова, да? Превратиться из жирного тролля в какое-то бестелесное нумерологическое создание блять?' },
    { w: 'g', t: 'Смотри: число моё. Применил функцию — получил другое число.', fx: function () {
        st.dangling = false; st.shown = 1; renderChain(0, false);
      } },
    { w: 'p', t: 'У тебя было два глаза. Я тебе выколол один. Ты ощутил разницу, а?' },
    { w: 'g', t: '...Грубо. Но, в общем, да. Именно так.' },
    { w: 'g', t: 'Смотри: твоё новое число больше тысячи, но меньше двух тысяч — ЭТО МЕЧ! Представляешь?', fx: showLane },
    { w: 'p', t: '...а от двух тысяч до трёх что?' },
    { w: 'g', t: 'Щит.', fx: peekShield },
    { w: 'p', t: 'БЛЯТЬ. Сильно не добрал?' },
    { w: 'g', t: 'На ' + MISS + '.' },
    { w: 'p', t: 'ПЕРЕКРУТИ.', btn: 'spin' },
    { w: 'g', t: 'Накрутился? Число одно. Крутится одинаково. Бери меч.' },
    { w: 'g', t: 'Та бери, бери.', fx: function () {
        stage.classList.add('hasSword1'); renderCards(null);
      } },
    { w: 'p', t: 'Этот меч такой же бесполезный, как и ты, да? СКОЛЬКО УРОНА У НЕГО????' },
    { w: 'g', t: 'А вот тут интересно. Урон мы сейчас ВЫВЕДЕМ ТОЙ ЖЕ ФУНКЦИЕЙ, ПРИКИНЬ.' },
    { w: 'g', t: 'Если скрестить призрака и бомбу из ежа, что выведется — знаешь?' },
    { w: 'g', t: 'Смотри-смотри: берём твоё новое число и крутим ещё раз. Выпало ' + C[1] + '. Делим на тысячу — вот твой урон.', fx: function () {
        st.shown = 2; renderChain(1, false); reveal('dmg', 'dmg');
      } },
    { w: 'p', t: IT.damage + '?! Что за урон — ' + IT.damage + '?!' },
    { w: 'g', t: 'Честный.' },
    { w: 'p', t: 'СКОРОСТЬ АТАКИ СКОЛЬКО? И знаешь что — дай мне на этот раз число ПОБОЛЬШЕ. Чтоб скорость побольше.' },
    { w: 'g', t: 'Число побольше — это не лут пожирнее. Это другой лут. Целиком. Вот из соседнего числа, на единицу больше твоего, выпадает серп. Кривой.' },
    { w: 'p', t: 'Почему кривой?!' },
    { w: 'g', t: 'Потому что число такое. Не я придумал. Я вообще уже умер.', fx: function () {
        st.shown = 3; renderChain(2, false); reveal('spd', 'spd');
      } },
    { w: 'p', t: 'Ладно. Показывай, что ещё у тебя есть.' },
    { w: 'g', t: 'Кручу дальше.', fx: function () {
        st.lock = true;
        setTimeout(function () { st.shown = 4; renderChain(3, false); reveal('name', null); }, 150);
        setTimeout(function () { st.shown = 5; renderChain(4, false); reveal('wt', 'wt'); }, 700);
        setTimeout(function () { st.shown = 6; renderChain(5, false); reveal('rar', null); st.lock = false; }, 1250);
      } },
    { w: 'p', t: '«' + PREF.charAt(0).toUpperCase() + PREF.slice(1) + '»?! Это ты сейчас про меч или про меня?' },
    { w: 'g', t: 'Число решило. Я тут никто.' },
    /* [слот: бит про хранение — вставить, когда автор пришлёт] */
    { w: 'p', t: 'Так. Последний вопрос. А если я тебя убью ещё раз?' },
    { w: 'g', t: 'Получишь то же число.' },
    { w: 'p', t: 'И тот же ' + PREF + ' меч с уроном ' + IT.damage + '?' },
    { w: 'g', t: 'И тот же ' + PREF + ' меч. Я, знаешь ли, не рандомный. Я — ' + SEED + '. Хоть сто раз меня убей.' },
    { w: 'n', t: 'Игрок заносит меч.', fx: function () { stage.classList.add('raised'); } },
    { w: 'g', t: 'НУ ПОПРОБУЙ.', btn: 'rekill' },
    { w: 'g', t: 'Ну что, доволен? Два одинаковых меча. Коллекционер блять.' },
    { w: 'n', t: 'Всё, что есть у меча, вывелось из одного числа. Нигде ничего не лежало.', btn: 'restart' }
  ];

  // ——— движок диалога ———

  function btn(label, cls, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.textContent = label;
    b.addEventListener('click', function (e) { e.stopPropagation(); onClick(); });
    return b;
  }

  function render() {
    var s = L[st.i];
    whoEl.className = 'who ' + (s.w === 'p' ? 'hero' : s.w === 'g' ? 'ghost' : 'note');
    whoEl.textContent = s.w === 'p' ? 'Игрок' : s.w === 'g' ? 'Дух босса' : '—';
    sayEl.className = 'say' + (s.w === 'n' ? ' note' : '');
    sayEl.textContent = s.t;
    btnsEl.innerHTML = '';

    if (s.btn === 'kill') {
      btnsEl.appendChild(btn('ДОБИТЬ', 'kill', function () {
        if (st.lock) return;
        st.lock = true;
        killAnim();
        setTimeout(function () { st.lock = false; next(); }, 1000);
      }));
    } else if (s.btn === 'spin') {
      btnsEl.appendChild(btn('КРУТАНУТЬ ЕЩЁ РАЗ', '', function () {
        st.spins++;
        renderChain(0, true);
        spinNote.textContent = st.spins === 1
          ? 'выпало ' + C[0] + '. опять.'
          : 'выпало ' + C[0] + '. опять. (' + st.spins + '-й раз)';
        if (st.spins === 1) btnsEl.appendChild(btn('дальше ▸', 'next', next));
      }));
    } else if (s.btn === 'rekill') {
      btnsEl.appendChild(btn('УБИТЬ ЕЩЁ РАЗ', 'kill', function () {
        if (st.lock) return;
        st.lock = true;
        rekillAnim();
        // та же цепочка пробегает заново — числа те же, предмет тот же
        for (var k = 0; k < C.length; k++) {
          (function (k) {
            setTimeout(function () { renderChain(k, false); }, 350 + k * 260);
          })(k);
        }
        setTimeout(function () {
          st.card2 = true;
          renderCards(null);
          stage.classList.add('hasSword2');
          matchEl.textContent = 'Совпал. Предмет в предмет.';
          matchEl.classList.remove('hidden');
          st.lock = false;
          next();
        }, 350 + C.length * 260 + 500);
      }));
    } else if (s.btn === 'restart') {
      btnsEl.appendChild(btn('СНАЧАЛА ▸', '', reset));
    } else {
      btnsEl.appendChild(btn('дальше ▸', 'next', next));
    }
  }

  function next() {
    if (st.lock) return;
    if (st.i >= L.length - 1) return;
    st.i++;
    var s = L[st.i];
    if (s.fx) s.fx();
    render();
  }

  function reset() {
    st = freshState();
    stage.classList.remove('killed', 'raised', 'hasSword1', 'hasSword2', 'flinch');
    $('burst').classList.remove('go');
    $('gburst').classList.remove('go');
    chainBlock.classList.add('hidden');
    laneWrap.classList.add('hidden');
    chainEl.innerHTML = '';
    spinNote.textContent = '';
    cardsEl.classList.add('hidden');
    cardsEl.innerHTML = '';
    matchEl.classList.add('hidden');
    render();
  }

  // клик по коробке диалога листает обычные реплики
  dlgEl.addEventListener('click', function () {
    var s = L[st.i];
    if (!s.btn) next();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') {
      var s = L[st.i];
      if (!s.btn) { e.preventDefault(); next(); }
    }
  });

  reset();
})();
</script>
